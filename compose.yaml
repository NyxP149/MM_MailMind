name: mailmind

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    env_file:
      - ${MAILMIND_ENV_FILE:-.env.deploy}
    environment:
      NODE_ENV: production
      PORT: 3000
      FRONTEND_URL: ${MAILMIND_PUBLIC_URL:?Définissez MAILMIND_PUBLIC_URL dans .env.deploy}
      GOOGLE_REDIRECT_URI: ${MAILMIND_PUBLIC_URL}/api/auth/google/callback
      TOKEN_STORE_PATH: /data/oauth.enc
      AGENT_STATE_PATH: /data/agent-state.enc
    volumes:
      - mailmind-data:/data
    extra_hosts:
      - host.docker.internal:host-gateway
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "127.0.0.1:${MAILMIND_LOCAL_PORT:-8080}:80"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  mailmind-data:
